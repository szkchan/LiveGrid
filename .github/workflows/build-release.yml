name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install build prerequisites
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "numpy<2" cython

      - name: Install project dependencies (incl. madmom from source)
        run: python -m pip install -r requirements.txt

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Fetch Rubber Band CLI (GPL, bundled for tempo warp)
        run: |
          curl.exe -sSfL -o rb.zip https://breakfastquay.com/files/releases/rubberband-4.0.0-gpl-executable-windows.zip
          Expand-Archive rb.zip -DestinationPath rbtmp
          New-Item -ItemType Directory -Force tools | Out-Null
          Move-Item rbtmp/rubberband-4.0.0-gpl-executable-windows tools/rubberband
          tools/rubberband/rubberband-r3.exe --version

      - name: Build exe
        run: >
          python -m PyInstaller main.py
          --name LiveGrid
          --windowed
          --onedir
          --noconfirm
          --collect-all madmom
          --collect-all imageio_ffmpeg
          --collect-all matplotlib
          --collect-all mido
          --add-data "tools/rubberband;rubberband"

      - name: Smoke test (analyze + tempo warp with the built exe)
        run: |
          python scripts/make_test_drift.py smoke.wav
          Start-Process -Wait -FilePath dist/LiveGrid/LiveGrid.exe -ArgumentList '-i','smoke.wav','--warp-out','smoke_out','--warp-bpm','120'
          if (-not (Test-Path smoke_out/smoke_120bpm_beat.wav)) { Write-Error "warp output missing"; exit 1 }
          Get-ChildItem smoke_out

      - name: Zip build output
        run: powershell Compress-Archive -Path dist/LiveGrid -DestinationPath LiveGrid-win64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: LiveGrid-win64.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install build prerequisites
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "numpy<2" cython

      - name: Install project dependencies (incl. madmom from source)
        run: python -m pip install -r requirements.txt

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Fetch Rubber Band CLI (GPL, bundled for tempo warp)
        run: |
          curl -sSfL -o rb.tar.bz2 https://breakfastquay.com/files/releases/rubberband-4.0.0-gpl-executable-macos.tar.bz2
          mkdir rbtmp && tar xjf rb.tar.bz2 -C rbtmp
          find rbtmp -maxdepth 3 | sort
          exe=$(find rbtmp -type f \( -name rubberband-r3 -o -name rubberband \) | head -1)
          mkdir -p tools && mv "$(dirname "$exe")" tools/rubberband
          chmod +x tools/rubberband/rubberband*
          file tools/rubberband/rubberband*
          ( tools/rubberband/rubberband-r3 --version || tools/rubberband/rubberband --version )

      - name: Build app
        run: >
          python -m PyInstaller main.py
          --name LiveGrid
          --windowed
          --onedir
          --noconfirm
          --collect-all madmom
          --collect-all imageio_ffmpeg
          --collect-all matplotlib
          --collect-all mido
          --add-data "tools/rubberband:rubberband"

      - name: Smoke test (analyze + tempo warp with the built app)
        run: |
          python scripts/make_test_drift.py smoke.wav
          dist/LiveGrid.app/Contents/MacOS/LiveGrid -i smoke.wav --warp-out smoke_out --warp-bpm 120
          test -f smoke_out/smoke_120bpm_beat.wav
          ls -la smoke_out

      - name: Zip build output
        run: |
          cd dist
          zip -r ../LiveGrid-macos.zip LiveGrid.app

      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: LiveGrid-macos.zip

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows-build/LiveGrid-win64.zip
            macos-build/LiveGrid-macos.zip
